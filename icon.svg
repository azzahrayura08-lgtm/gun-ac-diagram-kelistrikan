<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Automotive Blade Fuse Shape -->
  <g transform="translate(136, 100)">
    <!-- Fuse Housing -->
    <path d="M 20 40 L 220 40 L 220 180 L 190 200 L 50 200 L 20 180 Z" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="10"/>
    <!-- Blade Terminals -->
    <rect x="55" y="195" width="30" height="110" rx="6" fill="#94a3b8"/>
    <rect x="155" y="195" width="30" height="110" rx="6" fill="#94a3b8"/>
    <!-- Terminal holes -->
    <circle cx="70" cy="270" r="7" fill="#0f172a"/>
    <circle cx="170" cy="270" r="7" fill="#0f172a"/>
    <!-- Internal Fuse Element (S-curve) -->
    <path d="M 70 195 C 70 140 100 150 120 120 C 140 90 170 100 170 195" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
    <!-- Text GUN AC -->
    <text x="120" y="80" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">GUN AC</text>
    <text x="120" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">WIRING &amp; RELAY</text>
  </g>

  <!-- Snowflake A/C Badge -->
  <g transform="translate(350, 350) scale(0.9)">
    <circle cx="30" cy="30" r="45" fill="#0f172a" stroke="#06b6d4" stroke-width="6"/>
    <path d="M 30 5 L 30 55 M 5 30 L 55 30 M 12 12 L 48 48 M 12 48 L 48 12" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="6" fill="#e0f2fe"/>
  </g>

  <!-- High Voltage Badge -->
  <g transform="translate(60, 350) scale(0.9)">
    <polygon points="35,0 70,60 0,60" fill="#f97316" stroke="#ea580c" stroke-width="3"/>
    <text x="35" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">HV</text>
  </g>
</svg>
